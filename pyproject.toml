[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coagulation-cascade-engine"
version = "2.1.0"
description = "Coagulation laboratory calculations, mixing-study interpretation, and batch utilities."
readme = "README.md"
authors = [{ name = "Abu Suraih Sakhri" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<9",
]
server = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
coag-cascade = "cli:main"
coagulation-cascade-engine = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/coagulation-cascade-agent"
Repository = "https://github.com/abusuraihsakhri/coagulation-cascade-agent.git"

[tool.setuptools]
py-modules = ["cli", "coag_sentinel", "enrichment", "simulator"]

[tool.setuptools.packages.find]
include = ["agents*", "coagulation_cascade_agent*"]
